name: APK bauen
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken (neueste Version)
        run: |
          ZIP="$(ls -v *.zip | tail -n 1)"
          echo "Entpacke: $ZIP"
          unzip -o -q "$ZIP" -d projekt
          D="$(dirname "$(find projekt -name settings.gradle | head -n 1)")"
          echo "Projektordner: $D"
          echo "D=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: APK bauen
        working-directory: ${{ env.D }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Muskelaufbau-APK
          path: ${{ env.D }}/app/build/outputs/apk/debug/app-debug.apk
